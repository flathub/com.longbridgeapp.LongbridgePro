app-id: com.longbridgeapp.LongbridgePro
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: longbridgepro

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland

modules:
  - name: longbridgepro
    buildsystem: simple
    build-commands:
      - install -D longbridgepro.sh /app/bin/longbridgepro
      - install -Dm644 longbridgepro.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.longbridgeapp.LongbridgePro.png
      - install -Dm644 com.longbridgeapp.LongbridgePro.metainfo.xml -t /app/share/metainfo
      - install -Dm644 fonts.conf -t /app/share/fonts/
      - install -Dm644 com.longbridgeapp.LongbridgePro.desktop -t /app/share/applications
      - install -D apply_extra -t /app/bin
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            bsdtar -Oxf longbridgepro.deb 'data.tar.zst' |
              bsdtar -xf -
          - mv usr/local/bin/longbridge longbridge
          - rm -r longbridgepro.deb usr
      - type: file
        path: com.longbridgeapp.LongbridgePro.desktop
      - type: file
        path: com.longbridgeapp.LongbridgePro.metainfo.xml
      - type: file
        path: longbridgepro.sh
      - type: file
        path: longbridgepro.png
      - type: file
        path: fonts.conf
      - type: extra-data
        filename: longbridgepro.deb
        only-arches: [x86_64]
        url: https://assets.lbkrs.com/github/release/longbridge-desktop/stable/longbridge-v0.2.3-linux-x86_64.deb
        sha256: 6bcef91bfc8ee5e05539239c8c52cc147ca0ff59f53c12996860936e3447f737
        size: 34228596
        x-checker-data:
          type: json
          url: https://assets.lbkrs.com/github/release/longbridge-desktop/stable/latest.json
          version-query: .version
          url-query: .assets[] | select(.name | test("linux-x86_64\\.deb$")).url

  - name: noto-fonts
    buildsystem: simple
    build-commands:
      - mkdir --parents /app/share/fonts/
      - install -D NotoSans-Bold.ttf /app/share/fonts/
      - install -D NotoSans-Regular.ttf /app/share/fonts/
    sources:
      - type: archive
        url: https://noto-website-2.storage.googleapis.com/pkgs/NotoSans-hinted.zip
        sha256: 02e5f834c526f815f3b9f90f98e2b5b09f17cec107cc751c3b58fc3a2c0b2942

  - name: noto-fonts-cjk
    buildsystem: simple
    build-commands:
      - mkdir --parents /app/share/fonts/
      - install -D NotoSansCJK-Regular.ttc /app/share/fonts/
    sources:
      - type: archive
        url: https://noto-website-2.storage.googleapis.com/pkgs/NotoSansCJK-Regular.ttc.zip
        sha256: 32d03afb0b1109fa75a96f89dfc118015283a5343f2216ee4b3757c19992f75d
