app-id: com.longbridgeapp.LongbridgePro
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: longbridgepro

finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland

modules:
  - name: longbridgepro
    buildsystem: simple
    build-commands:
      - install -D longbridgepro.sh /app/bin/longbridgepro
      - install -Dm644 longbridgepro.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.longbridgeapp.LongbridgePro.png
      - install -Dm644 com.longbridgeapp.LongbridgePro.metainfo.xml -t /app/share/metainfo
      - install -Dm644 fonts.conf -t /app/share/fonts/
      - install -Dm644 com.longbridgeapp.LongbridgePro.desktop -t /app/share/applications
      - install -D apply_extra -t /app/bin
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            bsdtar -Oxf longbridgepro.deb 'data.tar.zst' |
              bsdtar -xf -
          - mv usr/local/bin/longbridge longbridge
          - rm -r longbridgepro.deb usr
      - type: file
        path: com.longbridgeapp.LongbridgePro.desktop
      - type: file
        path: com.longbridgeapp.LongbridgePro.metainfo.xml
      - type: file
        path: longbridgepro.sh
      - type: file
        path: longbridgepro.png
      - type: file
        path: fonts.conf
      - type: extra-data
        filename: longbridgepro.deb
        only-arches: [x86_64]
        url: https://assets.lbkrs.com/github/release/longbridge-desktop/stable/longbridge-v0.16.0-linux-x86_64.deb
        sha256: dc23b40f08b239369dcff9f46f9a617aa067b58a1899e5e25f137e63a9eb6094
        size: 48636344
        x-checker-data:
          type: json
          url: https://assets.lbkrs.com/github/release/longbridge-desktop/stable/latest.json
          version-query: .version
          url-query: .assets[] | select(.name | test("linux-x86_64\\.deb$")).url

  - name: noto-sans
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSans-Regular.ttf /app/share/fonts/NotoSans-Regular.ttf
      - install -Dm644 NotoSans.LICENSE.txt /app/share/fonts/NotoSans.LICENSE.txt
    sources:
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@noto-monthly-release-2026.05.01/fonts/NotoSans/hinted/ttf/NotoSans-Regular.ttf
        sha256: 478c558ea716033cd60c03438f628dfa75694dcf6b5f6d505a2f05fd2b4f3823
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io@noto-monthly-release-2026.05.01/fonts/LICENSE
        sha256: f2095b08bed08b23a6fe26112fcd679a2bee3f002eef077eb05d215ed1051bd8
        dest-filename: NotoSans.LICENSE.txt

  - name: noto-sans-cjk
    buildsystem: simple
    build-commands:
      - install -Dm644 NotoSansCJK-Regular.ttc /app/share/fonts/NotoSansCJK-Regular.ttc
      - install -Dm644 NotoSansCJK.LICENSE.txt /app/share/fonts/NotoSansCJK.LICENSE.txt
    sources:
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/Sans/OTC/NotoSansCJK-Regular.ttc
        sha256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a
      - type: file
        url: https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@Sans2.004/LICENSE
        sha256: 6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2
        dest-filename: NotoSansCJK.LICENSE.txt
